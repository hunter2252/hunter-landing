<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>Statistiques - Hunter.mg</title>
    <style>
        :root { --bg: #0a0e17; --primary: #10b981; --text: #e2e8f0; --text-muted: #94a3b8; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }

        h1 { color: var(--primary); }
        .counter { font-size: 3em; font-weight: 800; color: var(--primary); }
        a { color: var(--primary); }
    </style>
</head>
<body>
    <div class="card">
        <h1>📊 Statistiques</h1>
        <p>Visites totales :</p>
        <div class="counter">
            <img src="https://visitor-badge.laobi.icu/badge?page_id=hunter2252.hunter-landing" alt="Compteur">

        <br><br>
        <p style="color:var(--text-muted);">Compteur mis à jour à chaque visite.</p>
        <a href="/">← Retour</a>
    </div>

</html>
